<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCESS — BREACH INTEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030803;
      --accent: #00ff41;
      --border: #1a3320;
      --muted: #4a7a52;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Share Tech Mono', monospace;
      background: radial-gradient(ellipse at 50% -20%, #0a1f0a 0%, var(--bg) 60%);
      color: var(--accent);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .scanlines {
      position: fixed; top:0; left:0; width:100%; height:100%;
      pointer-events: none; z-index: 9998;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,255,65,0.02) 3px, rgba(0,0,0,0.12) 4px);
    }
    .terminal {
      width: 380px;
      background: rgba(8,18,8,0.92);
      border: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(0,255,65,0.1), inset 0 0 40px rgba(0,0,0,0.5);
      padding: 36px 32px;
      position: relative;
      z-index: 1;
    }
    .terminal::before {
      content: ''; position: absolute; top: -1px; left: -1px; width: 22px; height: 22px;
      border-top: 2px solid var(--accent); border-left: 2px solid var(--accent);
      filter: drop-shadow(0 0 4px var(--accent));
    }
    .terminal::after {
      content: ''; position: absolute; bottom: -1px; right: -1px; width: 22px; height: 22px;
      border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent);
      filter: drop-shadow(0 0 4px var(--accent));
    }
    h1 {
      font-size: 1rem;
      letter-spacing: 4px;
      text-align: center;
      margin-bottom: 6px;
      text-shadow: 0 0 10px rgba(0,255,65,0.6);
    }
    .subtitle {
      text-align: center; color: var(--muted); font-size: 0.72rem;
      letter-spacing: 2px; margin-bottom: 28px;
    }
    label { display: block; font-size: 0.68rem; color: var(--muted); letter-spacing: 2px; margin: 16px 0 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--border);
      color: var(--accent);
      font-family: inherit;
      font-size: 0.9rem;
      caret-color: var(--accent);
      outline: none;
      transition: all 0.25s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(0,255,65,0.35); }
    button {
      width: 100%;
      margin-top: 26px;
      padding: 13px;
      background: linear-gradient(180deg, rgba(0,255,65,0.18), rgba(0,179,45,0.28));
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 3px;
      cursor: pointer;
      text-transform: uppercase;
      text-shadow: 0 0 6px rgba(0,255,65,0.6);
      box-shadow: 0 0 15px rgba(0,255,65,0.2);
      transition: all 0.2s;
    }
    button:hover:not(:disabled) { background: rgba(0,255,65,0.32); box-shadow: 0 0 25px rgba(0,255,65,0.45); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .error {
      display: none;
      margin-top: 14px;
      padding: 10px;
      border: 1px solid rgba(255,34,34,0.4);
      background: rgba(255,34,34,0.08);
      color: #ff5555;
      font-size: 0.75rem;
      text-align: center;
    }
    .error.show { display: block; animation: shake 0.3s; }
    @keyframes shake {
      0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); } 75% { transform: translateX(-3px); }
    }
    .boot {
      position: fixed; bottom: 20px; left: 24px;
      color: var(--muted); font-size: 0.65rem; line-height: 1.6;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="boot">SYSTEM BOOT v2.0
SECURE SHELL ESTABLISHED
RESTRICTED AREA — AUTHORIZED PERSONNEL ONLY</div>

  <form class="terminal" id="loginForm">
    <h1>[ BREACH INTEL ]</h1>
    <div class="subtitle">&gt;&gt; AUTENTIKASI DIPERLUKAN &lt;&lt;</div>

    <label>USERNAME</label>
    <input type="text" id="username" autocomplete="username" autofocus />
    <label>PASSWORD</label>
    <input type="password" id="password" autocomplete="current-password" />

    <button type="submit" id="btnLogin">&gt; MASUK_</button>
    <div class="error" id="errorBox">⛔ AKSES DITOLAK — KREDENSIAL SALAH</div>
  </form>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const errBox = document.getElementById('errorBox');
    btn.disabled = true;
    btn.textContent = '> MEMVERIFIKASI...';
    errBox.classList.remove('show');
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      if (res.ok) {
        const j = await res.json();
        sessionStorage.setItem('bi_role', j.role || 'user');
        window.location.href = '/';
      } else {
        throw new Error();
      }
    } catch {
      errBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = '> MASUK_';
    }
  });
</script>
</body>
</html>
